spring.application.name=receipt

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

app.auth.jwt-secret=${AUTH_JWT_SECRET}
app.auth.google-client-id=${GOOGLE_CLIENT_ID:}
app.auth.mail-from=${AUTH_MAIL_FROM:noreply@example.com}

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
